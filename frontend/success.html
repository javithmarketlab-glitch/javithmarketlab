<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg" href="tab-logo.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Status - JavithMarketLab</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }

body{
  background:#0f172a;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.container{
  background:#1e293b;
  padding:40px;
  border-radius:20px;
  text-align:center;
  width:90%;
  max-width:450px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3);
}

.icon{ font-size:70px; margin-bottom:20px; }

h1{ margin-bottom:10px; font-size:1.6rem; }
h1.success-title{ color:#00ff99; }
h1.failed-title{ color:#ef4444; }

.plan-name{
  color:#00ff99;
  font-weight:bold;
  font-size:18px;
  margin:10px 0 20px;
}

p{ color:#d1d5db; margin-bottom:8px; font-size:15px; }

.status-msg{
  margin-top:12px;
  font-size:14px;
  color:#94a3b8;
  min-height:20px;
}

/* Success button */
.btn-success{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#00ff99,#00ccff);
  color:#000;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:20px;
  transition:all 0.3s;
  box-shadow:0 4px 15px rgba(0,255,153,0.3);
}
.btn-success:hover{ transform:translateY(-2px); }

/* Failed button */
.btn-failed{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#ef4444,#f97316);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:20px;
  transition:all 0.3s;
  box-shadow:0 4px 15px rgba(239,68,68,0.3);
}
.btn-failed:hover{ transform:translateY(-2px); }

/* Spinner */
.spinner{
  display:inline-block;
  width:40px;
  height:40px;
  border:4px solid rgba(255,255,255,0.15);
  border-top-color:#00ff99;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:15px auto;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* Countdown */
.countdown{
  font-size:13px;
  color:#64748b;
  margin-top:10px;
}
</style>
</head>
<body>

<div class="container" id="box">

  <!-- Loading state -->
  <div id="loadingView">
    <div class="icon">⏳</div>
    <h1 style="color:#94a3b8;">Verifying Payment...</h1>
    <div class="spinner"></div>
    <p class="status-msg">Please wait, do not close this page</p>
  </div>

  <!-- Success state -->
  <div id="successView" style="display:none">
    <div class="icon">✅</div>
    <h1 class="success-title">Payment Successful!</h1>
    <p>Your plan has been activated:</p>
    <div class="plan-name" id="planNameText">Lifetime Plan</div>
    <p class="status-msg">Redirecting to Members Area...</p>
    <div class="countdown" id="countdownText"></div>
    <button class="btn-success" onclick="goMember()">
      Go to Members Area 🚀
    </button>
  </div>

  <!-- Failed state -->
  <div id="failedView" style="display:none">
    <div class="icon">❌</div>
    <h1 class="failed-title">Payment Failed</h1>
    <p id="failedMsg">Your payment was not completed.</p>
    <p style="color:#94a3b8; font-size:13px; margin-top:8px;">
      No amount has been deducted.
    </p>
    <button class="btn-failed" onclick="goHome()">
      Go to Home Page 🏠
    </button>
  </div>

</div>

<script>
const BACKEND = "https://javithmarketlab.onrender.com";

// Back button block — cancel பண்ணி திரும்ப வர முடியாது
history.pushState(null, "", location.href);
window.addEventListener("popstate", () => {
  history.pushState(null, "", location.href);
});

function showSuccess(plan) {
  document.getElementById("loadingView").style.display = "none";
  document.getElementById("successView").style.display = "block";
  document.getElementById("planNameText").textContent  = plan || "Lifetime Plan";

  // 3 second countdown பிறகு auto redirect
  let secs = 3;
  document.getElementById("countdownText").textContent =
    "Auto redirect in " + secs + " seconds...";

  const timer = setInterval(() => {
    secs--;
    if (secs <= 0) {
      clearInterval(timer);
      goMember();
    } else {
      document.getElementById("countdownText").textContent =
        "Auto redirect in " + secs + " seconds...";
    }
  }, 1000);
}

function showFailed(message) {
  document.getElementById("loadingView").style.display = "none";
  document.getElementById("failedView").style.display  = "block";
  document.getElementById("failedMsg").textContent     =
    message || "Your payment was not completed.";
}

function goMember() {
  window.location.replace("member.html");
}

function goHome() {
  window.location.replace("Index.html");
}

async function activatePlan() {
  const params  = new URLSearchParams(window.location.search);
  const orderId = params.get("order_id");
  const email   = localStorage.getItem("email");
  const plan    = localStorage.getItem("selectedPlan") || "Lifetime Plan";

  // order_id இல்லாம நேரடியா வந்தா — home page
  if (!orderId) {
    showFailed("No payment found. Please complete payment first.");
    return;
  }

  // Login இல்லன்னா
  if (!email) {
    showFailed("Session expired. Please log in and try again.");
    return;
  }

  try {

    // STEP 1: Cashfree-ல் payment status verify
    const verifyRes  = await fetch(`${BACKEND}/verify-order/${orderId}`);
    const verifyData = await verifyRes.json();

    console.log("Cashfree Status:", verifyData.status);

    // Cashfree success statuses
    const successStatuses = ["PAID", "SUCCESS", "COMPLETED"];
    const isPaid = verifyData.success &&
                   successStatuses.includes(verifyData.status);

    if (!isPaid) {
      // Payment failed or cancelled
      showFailed("Payment was cancelled or failed. No amount deducted.");
      return;
    }

    // STEP 2: PAID — plan activate பண்ணு
    const updateRes  = await fetch(`${BACKEND}/update-plan`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, plan, orderId })
    });

    const updateData = await updateRes.json();
    console.log("Plan Activated:", updateData);

    // STEP 3: Success UI காட்டு → auto redirect member.html
    showSuccess(plan);

  } catch (err) {
    console.error("Error:", err);
    showFailed("Server error occurred. Contact support if amount was deducted.");
  }
}

activatePlan();
</script>

</body>
</html>
